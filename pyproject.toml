[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roleplay-slim"
version = "0.1.0"
description = "Dialogue/roleplay-aware LLM context compression — a library and an OpenAI-compatible proxy that knows the difference between a cache-stable persona prefix and the dialogue history you pay for on every request."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
proxy = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
tokens = [
    "tiktoken>=0.6",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[project.scripts]
roleplay-slim-proxy = "roleplay_slim.proxy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roleplay_slim"]
