[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roleplay-slim"
version = "0.2.0"
description = "Dialogue/roleplay-aware LLM context compression — a library and an OpenAI-compatible proxy that knows the difference between a cache-stable persona prefix and the dialogue history you pay for on every request."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
proxy = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
tokens = [
    "tiktoken>=0.6",
]
all = [
    "roleplay-slim[proxy,tokens]",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
]

[project.scripts]
roleplay-slim = "roleplay_slim.cli:main"
# Kept as-is: existing deployments and service files invoke this directly.
roleplay-slim-proxy = "roleplay_slim.proxy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roleplay_slim"]

[tool.mypy]
python_version = "3.10"
packages = ["roleplay_slim"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
