[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roleplay-slim"
version = "0.4.1"
description = "Dialogue/roleplay-aware LLM context compression — a library and an OpenAI-compatible proxy that knows the difference between a cache-stable persona prefix and the dialogue history you pay for on every request."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
proxy = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
tokens = [
    "tiktoken>=0.6",
]
all = [
    "roleplay-slim[proxy,tokens]",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.8",
]

[project.scripts]
roleplay-slim = "roleplay_slim.cli:main"
# Kept as-is: existing deployments and service files invoke this directly.
roleplay-slim-proxy = "roleplay_slim.proxy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roleplay_slim"]

# Without an explicit list, hatchling sweeps everything the .gitignore
# doesn't exclude into the sdist — which is how unrelated local scripts and
# the .hypothesis test cache ended up published in 0.3.1. Allowlist, not
# denylist: a new stray file in the working tree should not ship by default.
[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "examples/",
    "benchmark/",
    "docs/",
    ".github/workflows/",
    # hatchling auto-includes VCS files like .gitignore in the sdist
    # regardless of the allowlist; declare it so the cleanliness gate
    # (scripts/check_sdist.py) matches reality instead of flagging it.
    ".gitignore",
    "README.md",
    "README_CN.md",
    "QUICKSTART.md",
    "QUICKSTART_CN.md",
    "CHANGELOG.md",
    "gotchas.md",
    "LICENSE",
    "pyproject.toml",
]
# Anything under an allowlisted directory that must never ship: the
# hypothesis test cache (a VCS auto-include leaked it even though the
# directory isn't allowlisted) and bytecode caches.
exclude = [
    ".hypothesis/",
    "**/__pycache__/",
]

# Explicit rule set rather than ruff's defaults: defaults include
# opinionated style rules (ISC004 unparenthesized string concat, PERF102
# micro-optimizations) and rules that flag *deliberate* code — the proxy's
# broad `except Exception` (BLE001) and the tiktoken-optional try/except-pass
# (S110) are documented as intentional "never fail a live request" behavior,
# not defects. F/I/UP catch real bugs (unused imports, undefined names,
# import hygiene) and modern-Python wins without policing style.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF022"]
