# Example roleplay-slim config modeled on a real production roleplay chat
# bot's message structure — a stable [SYSTEM_PROMPT, SHARED_BLOCK] prefix
# (~2 system messages) followed by conversation history, memory-retrieval
# blocks, and a repeated per-request format-reminder footer.
#
# No real user data or persona text is included here — only the shape.

[proxy]
upstream_base_url = "https://api.deepseek.com/v1"
upstream_api_key_env = "UPSTREAM_API_KEY"
host = "127.0.0.1"
port = 8791

# Optional: require callers to authenticate before the proxy spends your
# upstream key. Set client_auth_token_env to the NAME of an env var holding
# the shared secret (it is never forwarded upstream). Add more callers via
# client_auth_tokens_extra — a comma-separated list of additional accepted
# credentials, e.g. a chat bot's own key. Anyone who can reach the port and
# presents a credential not listed here gets 401.
# client_auth_token_env = "PROXY_AUTH_TOKEN"
# client_auth_tokens_extra = "sk-bot-key,Operit_phone_token"

[compressor]
# Keep the last 6 turns (a "turn" = one user message + the reply that
# answered it) completely verbatim. Roleplay apps benefit from more
# recent-context headroom than a typical customer-service bot needs.
keep_recent_turns = 6

enable_whitespace_normalize = true
enable_dedupe_verbatim_tail = true
enable_history_window = true
enable_strip_stage_directions = false

# Preserve complete dialogue by default. "trim" is lossy: it removes middle
# sentences, which can contain facts, corrections and commitments.
# "drop" discards older turns; use only after independently verifying your
# external memory contains every fact you need. Summaries can also omit facts.
history_window_mode = "preserve"

# This app wraps action/stage-direction text in full-width parens, e.g.
# "（轻轻拨弄吉他弦）你好。". Use a built-in preset name (see
# STAGE_DIRECTION_PRESETS in roleplay_slim/config.py: "fullwidth_parens",
# "halfwidth_parens", "asterisk", "square_bracket") or your own raw regex
# if your app uses a different convention.
stage_direction_pattern = "fullwidth_parens"

# --- Optional: a hard ceiling on the whole prompt ------------------------
#
# If you need a best-effort upper bound (to cap cost,
# or to stay clear of a context limit), set one here and the oldest turns
# are dropped until the estimate fits.
#
# This is a lossy opt-in even in preserve mode: dropping old turns can delete
# facts. Leave it unset when complete history is required.
#
# The cache-stable prefix is never dropped to meet this, and neither are
# the most recent budget_min_recent_turns turns — a budget too small for
# those is logged and left unmet rather than met by breaking the prompt.
#
# max_prompt_tokens = 4096
# budget_min_recent_turns = 1

# --- Optional: your own summarizer --------------------------------------
#
# history_window_mode = "summarize" replaces the aged-out history with one
# message produced by a callable you supply. It cannot be configured here
# — TOML can only produce data, never a function — so load this file and
# then attach it:
#
#     config = ProxyConfig.from_toml("config.toml")
#     config.compressor.summarizer = my_summarizer
#     config.compressor.history_window_mode = "summarize"
#
# Setting `summarizer` as a key in this file is rejected with an
# explanation rather than failing later inside compression.

[stats]
# Whether /stats survives restarts. Default true — every request is written
# as one row in `db_path` (an SQLite file next to wherever the proxy runs),
# so a restart doesn't zero the numbers. Set persist=false to fall back to
# a pure in-memory accumulator (identical /stats output, nothing on disk).
persist = true
# db_path = "stats.db"
