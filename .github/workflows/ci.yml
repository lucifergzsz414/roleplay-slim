name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev, proxy, and tokens extras
        run: pip install -e ".[dev,proxy,tokens]"
      - name: Lint
        run: ruff check src/roleplay_slim tests benchmark examples scripts
      - name: Run tests
        run: pytest -v
      - name: Type check
        run: mypy

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hatch
        run: pip install hatch
      - name: Verify sdist contains only allowlisted files
        run: python scripts/check_sdist.py
