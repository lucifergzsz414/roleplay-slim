name: 功能建议 / Feature request
description: 提议可复用的启动器、代理、压缩策略或文档改进
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，而不只是希望增加的按钮或选项。建议应尽量适用于一类用户，而不是绑定某个私人角色或单一应用。

        请同时参考 [ROADMAP](https://github.com/lucifergzsz414/roleplay-slim/blob/master/ROADMAP.md)。新的压缩策略或大型子系统在实现前通常需要先写一份简短的 [design doc](https://github.com/lucifergzsz414/roleplay-slim/tree/master/docs/designs)。

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - Windows 图形版
        - OpenAI 兼容代理
        - Anthropic Messages 代理
        - Python 压缩库
        - 文档与上手体验
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 当前工作流哪里困难、容易出错或无法完成？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述理想行为；不需要先给出实现代码。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 现有配置、策略或外部工具能否部分解决？

  - type: textarea
    id: generality
    attributes:
      label: 适用场景
      description: 哪些聊天软件、服务商或消息结构会受益？
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 这项建议不要求在仓库中提交 API Key、聊天正文或其他隐私数据。
          required: true
